name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # the exact environment releases are built with
      - run: pip install -r requirements.lock.txt
      # the gate must be seen to fail: every bad fixture is refused for its stated reason
      - run: pytest -q
      - run: python atlas_validate.py data
      # derived/ is a function of the records: a stale committed export fails
      - run: python scripts/build_release.py --check
