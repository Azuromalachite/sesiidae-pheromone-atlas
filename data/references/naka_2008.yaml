{reference_id: spa.ref.naka_2008, citation: 'Naka H, Horie Y, Mochizuki F, Vang LV, Yamamoto M, Saito T, Watarai T, Tsuchida K, Arita Y, Ando T (2008) Identification of the sex pheromone secreted by Synanthedon hector (Lepidoptera: Sesiidae). Appl Entomol Zool 43(4):467-474.', doi: 10.1303/aez.2008.467, pmid: null, read: full_text, notes: 'No PubMed record found by DOI on 2026-10-23. The abstract labels Z3,Z13-18:OAc as I and E3,Z13-18:OAc as II (ratio 60:36:4); the Results label E3 as I and Z3 as II (36:60:4). The substance agrees; the labels are swapped. Test I: the text says the 50:50 lure caught 92 males in four traps, Table 1 gives 24.5 per trap with n = 2. The authors report that no other insects were caught in any of these field tests.'}
