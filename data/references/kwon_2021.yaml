notes: "No PubMed record found by DOI on 2026-10-23. The headline optimum, about 4.3:5.7, is not an observation: it is the tested 4:6 lure corrected for the measured purities (0.4 x 94.18 : 0.6 x 82.8), so no record holds it. The Discussion says Yang et al. 2011 used lures containing an isomeric mixture and gave no isomeric information; Yang 2011 (Methods, p. 399) states isomeric purity above 99 percent. The records keep both papers' statements; the conflict is in docs/curation-log.md."
