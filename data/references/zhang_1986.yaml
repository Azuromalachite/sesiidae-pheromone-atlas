notes: PMID 24307107 found by DOI on 2026-10-23. Karalius et al. 2001 cite a 1985 Chinese version (Organic Chemistry 2:184-187), not curated. The paper shows that the natural compound matches synthetic
  E3,Z13-18:OH (spectrum, retention on SE-54, mass fragmentography on FFAP against all four isomers, co-injection); it does not state that the other isomers, Z3,Z13-18:OH among them, or any other compound
  were absent. 'Only E3,Z13-18:OH was detected' (Karalius 2001; Mozuraitis 2007) is their reading of it. Table 3 gives an average of 1.4 for a total of 9 over 5 replicates (9/5 = 1.8); the records use totals.
  The Z,Z isomer, inactive for P. tabaniformis, was 'highly attractive' to Aegeria apiformis (= Sesia apiformis); no numbers, not recorded. Rearing on artificial diet is stated, the origin of the insects
  is not.
