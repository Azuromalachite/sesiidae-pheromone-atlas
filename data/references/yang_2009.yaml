notes: 'PMID 19830490 found by DOI on 2026-10-23. Double-bond positions were not located: DMDS adducts gave no diagnostic ions, so the 3,13 and 2,13 positions rest on retention indices against all four
  isomers of each on two columns and on sesiid precedent (Discussion). ''None of the other geometrical isomers of major components were attractive'' is stated with data not shown; not recorded. No other
  sesiid species came to the 1:1 lure (not recorded: no non-target catch in the schema).'
