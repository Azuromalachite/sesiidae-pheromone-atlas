read: full_text
notes: 'PMID 17265175 found by DOI on 2026-10-23. Table 1, Test III prints 100 ug of E2,Z13-18:OH in two rows (13.0 a and 0.3 b); the text and abstract give the best lure as 1:100 (E2,Z13-18:OH : E2,Z13-18:Ald),
  so the first is 10 ug (Atlas reading, recorded so; the schema cannot flag an amount as inferred, so each record''s notes say it). The paper is inconsistent either way: the female gland ratio is ''roughly
  1:10'', which the printed 100 ug would match, yet the Discussion calls the 1:100 optimum similar to the females'' blend. Table 2 heads its columns ''Touched'' then ''Attracted'', but the text''s statements
  match the reverse (the 1,000:50 and 1,000:300 lures significantly above E2,Z13-18:OH alone in approaches; 1,000:50 above all in touches; about half of approaching males touched), so the first column is
  read as approaches (Atlas reading). The text places Test III about 4 km from the aldehyde-acetate field; the Table 1 footnote puts Tests III and IV in the same fields as Test II. Mean +- values are SD.
  The EAG dose-response series (Fig. 3b, d) is not recorded: it adds no compound and its doses are not lures. No M. longipes males came to traps in the M. japona tests, and no M. japona males to lures in
  the M. longipes habitat; not recorded (no non-target catch in the schema).'
