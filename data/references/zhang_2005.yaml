notes: 'PMID 16195855 found by DOI on 2026-10-23. Statistics: the Methods say log(x + 1) and REGW range tests; the Fig. 2 legend says arcsin square-root transformed proportions. Control traps caught nothing
  and were left out of the analyses. The 88:6:6 ternary ratio is ''estimated'' without saying from which analysis; the gland extract gave 94:6 and no Z,E-3,13-ODDA. Not recorded: species specificity (about
  92 and over 97 percent of moths were DWB, citing Leskey et al. 2005) and lure longevity (Table 2). The Results text (p. 2468) says only two peaks were ''deleted'' where ''detected'' is meant. The Discussion
  cites ''Figures 3 and 6'' as trials where the 88:6:6 ternary was no better than the 94:6 binary, but Fig. 3 never tested 88:6:6 (it added 0.5-10 parts Z,E-3,13 to 94:6). It also calls the Z,Z/Z,E 94:6
  lure ''the ternary blend'', and 94:6 ''the natural ratio'', which holds for the gland extract only. The abstract gives the binary as Z,Z with ''1-3%'' E,Z-2,13-ODDA; every binary lure tested had 6 parts.
  Table 2 footnote c dates the 8-week exposure 18 May - 9 July 2004 in North Carolina; the text says 8 May - 9 July 2004 in Virginia.'
