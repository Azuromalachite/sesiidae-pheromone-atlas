notes: No PubMed record found by DOI on 2026-10-23. The moth is Melittia cucurbitae in the paper (GBIF now Eichlinia cucurbitae). The abstract gives the effective binary as 99.7:0.3; the lures used the
  Table 1 proportions (68.5 and 0.1 percent, i.e. about 99.85:0.15), so the two disagree. Table 1 names compound 9 'hexadecen-1-ol acetate' with the acronym Z-9-16:OH; the abstract and the acetylation result
  make it the alcohol. The abstract hedges every minor compound ('probably also contained'); the Results call compounds 1, 6, 7, 8 and 10 confirmed by MS and single-numbered peaks confirmed by retention
  on two columns. Synanthedon acerrubri males were caught in Test 1 (totals 0, 1, 10 and 16 for treatments A to D); not recorded, the species is outside the v0.1 target and only totals are given.
