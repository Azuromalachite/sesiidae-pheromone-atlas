notes: 'PMID 4841145 found by DOI on 2026-10-23. Calls the peachtree borer Sanninoidea exitiosa throughout. The text gives the natural S. pictipes pheromone as ''120 ug, about 30 female equivalents''; the
  Fig. 2 legend gives ''120 ng = 30 FE (LB) = 1 FE (PB)''. The internal evidence favours ng: the text''s 1.2 ug = about ten S. exitiosa female equivalents agrees with the legend''s 120 ng = 1 FE, and 4
  ug per S. pictipes female would be implausible (Atlas reading). The IR text calls the band absent in S. exitiosa ''960 cm-1'' after giving the trans band as 970 cm-1. Reported without numbers and not
  recorded: the Z,Z-isomer and the purified natural S. exitiosa pheromone ''identical in attractiveness''; after silver-nitrate purification each isomer as attractive as its natural pheromone and not attractive
  to the other species; the (E,E)- and (Z,E)-isomers inactive for both; binary mixtures with the (Z,E)-isomer. Bioassay of note 8: fractions in 0.5 ml pentane poured into glass petri dishes on the ground
  of a peach orchard, males responding tabulated over 35 min.'
