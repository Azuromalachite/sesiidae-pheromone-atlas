notes: 'No PubMed record found by DOI on 2026-10-23. The text names a ''DB-13'' column twice; note 3 lists only SP1000, SP2340 and DB-1, so DB-1 is meant (Atlas reading). Not recorded, stated without numbers:
  grape root borer males caught ''in low numbers'' in traps baited with E,Z-2,13-18:OAc, and ''large numbers'' of Synanthedon acerrubri in the same traps. The squash vine borer is called Melittia satyriniformis,
  a synonym of Eichlinia cucurbitae.'
