{reference_id: spa.ref.naka_2013, citation: 'Naka H, Suzuki T, Watarai T, Horie Y, Mochizuki F, Mochizuki A, Tsuchida K, Arita Y, Ando T (2013) Identification of the sex pheromone secreted by Synanthedon tenuis (Lepidoptera: Sesiidae). Appl Entomol Zool 48:27-33.', doi: 10.1007/s13355-012-0148-0, pmid: null, read: full_text, notes: 'Published online 2012-11-07; printed in the 2013 volume (Crossref gives issue 1). Coordinates for the Motosu and Gifu sites are printed with N and E swapped (e.g. 136.67 N, 35.47 E). The Fig. 2 caption lists diagnostic ions (233, 206, AcOH-1) that differ from the text (219, 205, 191, AcOH+1). No PubMed record found by DOI on 2026-10-23. Tests II and III ran at the same orchards over the same dates and print the same Z3,Z13-18:OAc-alone row (10.7 +- 4.0, N = 6), so they probably share those traps (Atlas reading); the records cannot link them (no experiment_id yet). Single Z3,Z13-18:OAc lures attracted no other sesiid species (not recorded: the schema has no non-target catch).'}
