notes: 'PMID 11837667 found by DOI on 2026-10-23. A screening of 3Z,13Z-, 3E,13Z- and 2E,13Z-18:OH and their acetates, alone and in binary 9:1, 5:5 and 1:9 mixtures (0.3 mg per lure), at two Kazakh sites
  (Kandagash, 5-16 June 1999; Dzhanibek, 18-27 June 1999) and one Lithuanian (Zemaiteliai, 17 June - 20 July 2000), three replicates per site. Table I pools the sites: total males per lure, with letters
  (Duncan, sqrt(x+1)); a dot is a zero catch, letter a. Recorded: the three sesiids in Table I. Not recorded: the three Tineidae (outside the Atlas''s family), Chamaesphecia crassicornis and C. astatiformis
  (four and six males, called preliminary by the authors and not in Table I), and the hours of flight activity (no observation type). The species in each Table I column is caught only at the sites the text
  names; the sites are not separated in the table.'
