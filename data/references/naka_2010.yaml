notes: 'PMID 20834150 found by DOI on 2026-10-23. Table 2 totals do not follow from its means and trap numbers: the binary lure''s means give 84 + 2 + 46 = 132 against a printed 144, the five-component
  lure''s 122 against 130, Z3,Z13-18:OH alone 21 against 23. The five-component lure (Table 2 footnote e) holds Z3,E13-18:OH, Z3,E13-18:OAc and Z3-18:OAc, while the gland''s minor compounds were E3,Z13-18:OH,
  E3,Z13-18:OAc and Z13-18:OH and the 3Z,13E isomers were ''undetectable''; the text says the lure added ''the three other minor components ... at the same mixing ratio as that found in the pheromone extract''.
  Recorded as printed. Arakawa et al. (JP patent P2009-209104A) identified Z3,Z13-18:OH, Z3,Z13-18:OAc and E3,Z13-18:OH earlier; not curated (a patent). The 2006 screening (Table 1) was one part of a larger
  field evaluation whose other lures are not reported.'
