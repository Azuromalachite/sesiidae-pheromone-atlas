  source_location: Experiment 5; Fig. 3B
  author_statement: In each of these experiments, pheromone-baited all-yellow unitraps caught significantly more moths than any other single colour unitrap (Fig. 3B).
  notes: 'Experiment 5, 2-16 July 2008, randomised complete blocks, 9 replicates, 3 unitraps 20 m apart, blocks 50 m apart, checked every 3-4 days; ANOVA F2,16 = 5.089, ''P < 0.019'' as printed, Tukey (alpha 0.05). Unitraps (lid, funnel, bucket, lure basket); all-green and all-white from Contech Enterprises (embossed as the original Unitrap, made in the UK), all-yellow and all-red from AgBio Inc. (made by ChemTica International, Costa Rica); translucent white lure basket (AgBio) holding the septum unless stated; 2.5 x 5.0 cm 10% dichlorvos strip (Vaportape II) in every bucket. Lure: grey halobutyl rubber septum (West Co.) loaded with 1 mg Z3,Z13-18:OAc (Pherobank, >95% isomeric purity) in 200 µL hexane; the micro sign was checked in the PDF font stream: ''1 mg'' is set in the text font, ''200 µL'' uses the symbol font. Means read from the bar chart (Fig. 3B), Atlas reading; letters b vs a. Trap colour and supplier are confounded (yellow and red traps from one maker, green and white from another). Atlas reading of Fig. 3A (words only): white unitraps reflect most overall (~90% above ~420 nm); yellow rises above ~500 nm to ~55%; green is low with a broad peak near 510 nm (~20%); red rises above ~590 nm to ~30%; the authors state ultraviolet reflectance was similar in yellow and white unitraps.'
