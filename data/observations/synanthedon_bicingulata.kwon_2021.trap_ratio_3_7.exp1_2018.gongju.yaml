  source_location: "Experiment 1; Fig. 5c"
  author_statement: "Significantly more males were attracted to traps baited with a 4:6 ratio compared with traps baited with a 3:7 ratio at Gonju in 2018."
  notes: "Experiment 1, 27 August - 4 October 2018 (autumn, Atlas label from the dates), yellow bucket traps, 4 blocks, one-way ANOVA and Tukey HSD. The authors give the optimum as about 4.3:5.7: that is this 4:6 lure corrected for purity, and no 4.3:5.7 lure was tested. Lures synthesised by the authors: 1 mg per sleeve-stopper septum with 1 mg BHT, changed monthly; traps 3 m up on roadside cherry trees, at least 15 m apart, re-randomised every two weeks. Purity is GC-MS peak area; the authors do not say what the impurities are and state that the lures held no isomeric compounds. Atlas reading of Fig. 4: the impurities are minor peaks 0.07-0.37 min after each main peak (13.763 and 13.903 min for E3; 13.745, 13.903 and 14.037 min for Z3), on a column where E3 and Z3 eluted 0.035 min apart in separate runs, so geometric isomers among them are not excluded. Means read from bar charts. Gongju, F4,15 = 5.962, P = 0.004. Letters ab vs a. The text places a significant 4:6 vs 3:7 difference at Gongju; in Fig. 5, Gongju 3:7 is ab and Jinju 3:7 is bc, so the figure shows it at Jinju. The record follows the figure."
