observation_id: spa.obs.synanthedon_tenuis.yang_2012.trap_vs_females
observation_type: behavioural_response
taxon: spa.tax.synanthedon_tenuis
context: {sex: male, habitat: persimmon orchard, population: "Korean population", locality: "Gimhae, Republic of Korea"}
assay: field_trapping
blend:
