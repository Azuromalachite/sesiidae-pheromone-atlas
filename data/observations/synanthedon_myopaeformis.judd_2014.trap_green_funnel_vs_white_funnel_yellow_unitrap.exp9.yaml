evidence:
  reference: spa.ref.judd_2014
  source_location: Experiment 9; Table 1
  notes: 'Experiment 9, 30 June - 12 July 2011, 9 linear blocks (Table 1 n), 3 unitraps 1 m apart east-west in one tree row, blocks at least 50 m apart, checked every 4 days and rotated clockwise one position, so each trap occupied each position at least once. Component varied in the experiment: funnel. This treatment and comparator differ in the funnel colour only, which the trap schema cannot express; it is in trap.colour. Two-way randomised block ANOVA F2,16 = 14.25, P < 0.001, Tukey (alpha 0.05). Means +- SE from Table 1: 12.0 +- 3.2 (Y:G:Y:W, letter b) vs 61.0 +- 15.7 (Y:W:Y:W, letter a). Unitraps (lid, funnel, bucket, lure basket); all-green and all-white from Contech Enterprises (embossed as the original Unitrap, made in the UK), all-yellow and all-red from AgBio Inc. (made by ChemTica International, Costa Rica); translucent white lure basket (AgBio) holding the septum unless stated; 2.5 x 5.0 cm 10% dichlorvos strip (Vaportape II) in every bucket. Lure: grey halobutyl rubber septum (West Co.) loaded with 1 mg Z3,Z13-18:OAc (Pherobank, >95% isomeric purity) in 200 µL hexane; the micro sign was checked in the PDF font stream: ''1 mg'' is set in the text font, ''200 µL'' uses the symbol font. Atlas choice: green component against the white one, both in otherwise yellow traps (letters b vs a).'
