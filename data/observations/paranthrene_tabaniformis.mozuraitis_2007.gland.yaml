  source_location: Results and Discussion; Figs. 1-2
  author_statement: 'the percentages of E3,Z13-18:OH; Z3,Z13-18:OH; E2,Z13-18:OH; Z13-18:OH and 18:OH from the sex pheromone gland extracts of 3 females were found to be 64.0 : 32.4 : 1.4 : 0.9 :1.3'
  unresolved:
  - titre per female
  - whether acetates and aldehydes were absent (the screen used m/z 61 but no negative is stated)
  notes: Pupae from Populus spp. at Kandagash (Rynkum sandy-hill steppe), 29 May - 1 June 2001, adults emerged in individual cages. Abdominal tips of calling females (afternoon) pushed out, excised and
    washed twice in 20 ul hexane for 2 min; three glands extracted in all, concentrated to about 10 ul. One DB-5 column; chromatograms screened by diagnostic ions (m/z 61, 248, 250, 252), then identity
    by mass spectrum and retention against synthetic standards. Geometry therefore rests on retention on one non-polar column (Atlas reading). abundance_class 'major' for E3,Z13-18:OH is the Atlas reading
    of 64 percent and of the title's 'minor' components for the rest. The Chinese identification (Zhang et al. 1986) found only E3,Z13-18:OH.
