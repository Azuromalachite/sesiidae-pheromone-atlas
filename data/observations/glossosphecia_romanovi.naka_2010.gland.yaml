evidence:
  reference: spa.ref.naka_2010
  taxon_name_as_reported: Glossosphecia romanovi
  source_location: Results; Fig. 1
  author_statement: the female moths produced the alcohol and acetate in a ratio of about 20:1, in addition to three other minor structure-related components
  unresolved:
  - how many of the three females' extracts were analysed (Fig. 1 shows one 1.0 FE GC-MS injection and one 0.5 FE GC-EAD run)
  - titre per female
  - detection limit for the negatives
  notes: 'Muddy cocoons from a vineyard in Tottori Prefecture in winter; three females and two males emerged after about two months. Abdominal ends of one-day-old calling virgin females, each in hexane
    for 5 min. 1.0 FE on GC-MS (DB-23). Z3,Z13-18:OH and Z3,Z13-18:OAc: retention equal to the synthetics in GC-EAD and spectra ''quite similar'' to them. The three minor compounds: ''the chromatographic
    behavior and spectral data of these compounds suggested the following chemical structures'', with no further chemistry because the extract was limited, so tentative. Ratio about 100:5:1:1:2 (Z3,Z13-OH
    : Z3,Z13-OAc : E3,Z13-OH : E3,Z13-OAc : Z13-OH) from the TIC. The (3E,13E)- and (3Z,13E)-isomers of the acetate and alcohol were undetectable in the mass chromatograms (Fig. 1C, D).'
