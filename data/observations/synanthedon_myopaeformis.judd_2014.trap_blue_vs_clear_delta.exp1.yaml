  author_statement: Catches by all treatments in group 1 were significantly greater than all in group 2.
  notes: 'Experiment 1, 21 June - 5 July 2007 (counted 28 June and 5 July), randomised complete blocks, 10 replicates, 8 delta traps 5 m apart in linear blocks 20-21 m apart; two-way randomised block ANOVA F7,63 = 4.47, P < 0.001, Tukey (alpha 0.05). Delta traps 21 cm long, 10 x 10 x 10 cm cross-section, painted inside and out with a gloss white base coat (Krylon Fusion) then a high-gloss Ecologic acrylic (Cloverdale Paints); clear traps left unpainted; lure pinned at the upper centre; traps about 1.5 m up in the canopy; sticky bases. Lure: grey halobutyl rubber septum (West Co.) loaded with 1 mg Z3,Z13-18:OAc (Pherobank, >95% isomeric purity) in 200 µL hexane; the micro sign was checked in the PDF font stream: ''1 mg'' is set in the text font, ''200 µL'' uses the symbol font. Means read from the bar chart (Fig. 1B), Atlas reading; letters b vs a. The abstract sorts clear, white, green and yellow into group 1 and purple, blue, red and black into group 2, every group-1 trap catching significantly more than every group-2 trap. Atlas reading of Fig. 1A (words only): white about 80% flat above ~410 nm; yellow rises at ~500-520 nm to ~70%; green peaks near 530 nm (~60%); blue peaks near 460 nm; purple peaks near 420 and 660 nm; red rises above ~570 nm; black near zero throughout; clear was measured as acetate over the white standard (~85%, neutral). The authors group yellow, green and white as similarly high at 500-550 nm.'
