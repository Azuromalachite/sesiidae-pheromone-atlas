  notes: 'Experiment 3, 7-10 September 2008, N = 4, 98 males in total. 1:1 blend at 0.1, 0.5, 1 and 2 mg per septum. Letters: 0.1 mg b, 0.5 mg b, 1 mg ab, 2 mg a, control c. Each dose is compared with the
    lowest, 0.1 mg. Dose and catch correlated (r2 = 0.91, P < 0.01). Sticky delta traps 1-1.5 m up, complete randomized blocks of four, traps at least 10 m apart, counted daily; log(x + 1) one-way ANOVA,
    Tukey''s test at alpha 0.05. Pherobank synthetics, isomeric purity stated as above 99 percent. Means read from the bar chart.'
