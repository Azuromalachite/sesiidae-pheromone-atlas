  author_statement: "A significant difference was evident in the number of male S. bicingulata caught in yellow and green bucket traps"
  notes: "Experiment 3, Seoul, 26 April - 7 June 2018, 4 blocks, t test (t = 3.174, P < 0.05, df = 6). Lures synthesised by the authors: 1 mg per sleeve-stopper septum with 1 mg BHT, changed monthly; traps 3 m up on roadside cherry trees, at least 15 m apart, re-randomised every two weeks. Purity is GC-MS peak area; the authors do not say what the impurities are and state that the lures held no isomeric compounds. Atlas reading of Fig. 4: the impurities are minor peaks 0.07-0.37 min after each main peak (13.763 and 13.903 min for E3; 13.745, 13.903 and 14.037 min for Z3), on a column where E3 and Z3 eluted 0.035 min apart in separate runs, so geometric isomers among them are not excluded. Means read from bar charts."
