  source_location: Results; Figs. 1-2
  author_statement: The extract included only Z3,Z13-18:OAc, but no alcohols or aldehydes were detected.
  unresolved: [detection limit for the negatives, dispersion of the 2 ng titre]
  notes: 'About 20 larvae from a persimmon orchard, January 2002, reared at 25 C, 15L:9D; nine females emerged and all were extracted, 1-2 days old, calling 12-15 h after lights on. Titre ''about 2 ng/female'' from five 1-female-equivalent GC-MS runs (N = 5). Geometry from retention on DB-23 (KI 2639) against all four 3,13 isomers; the authors note the EI spectra of the isomers are quite similar, and the diagnostic ions suggested the 3,13 positions. Negatives: no peaks at the retention times of the other three 3,13 acetates, E2,Z13-18:OAc, E3,Z13- and Z3,Z13-18:OH, or E2,Z13-18:Al (Fig. 2). Z2,Z13- and E2,E13-18:OAc are not recorded as negatives: their standards elute at or beside the Z3,Z13-18:OAc peak in Fig. 2a, so retention alone cannot exclude them (Atlas reading). Atlas note: Korean S. tenuis glands showed the reverse, Z3,Z13-18:OH present and Z3,Z13-18:OAc absent below about 100 pg (spa.obs.synanthedon_tenuis.yang_2012.gland).'
