  source_location: Experiment 4; Fig. 2B
  notes: 'Experiment 4, 7-17 July 2007 (counted 14 and 17 July), randomised complete blocks, 10 replicates, 5 delta traps 5 m apart in linear blocks 20 m apart; ANOVA F4,36 = 6.986, P < 0.001, Tukey (alpha 0.05). Delta traps 21 cm long, 10 x 10 x 10 cm cross-section, painted inside and out with a gloss white base coat (Krylon Fusion) then a high-gloss Ecologic acrylic (Cloverdale Paints); clear traps left unpainted; lure pinned at the upper centre; traps about 1.5 m up in the canopy; sticky bases. Fluorescent pigments from Beauti-Tone (Home Hardware). Lure: grey halobutyl rubber septum (West Co.) loaded with 1 mg Z3,Z13-18:OAc (Pherobank, >95% isomeric purity) in 200 µL hexane; the micro sign was checked in the PDF font stream: ''1 mg'' is set in the text font, ''200 µL'' uses the symbol font. Means read from the bar chart (Fig. 2B), Atlas reading; letters b vs c. Reflectance (Fig. 2A and text): both fluorescent pigments reflect far more at 500-550 nm than the nonfluorescent paints (peaks well above 100% of the white standard); the authors give ultraviolet (300-400 nm) reflectance of 5.8% (Turf Green) vs 14.5% (Saturn Yellow), and above 550 nm 16.6% vs 133.5%. Yellow vs clear in this experiment differs from experiment 1, where yellow and clear shared a letter. Contrast used in the Results for the ultraviolet argument: Turf Green reflects less ultraviolet (5.8% vs 14.5%, 300-400 nm) and less light above 550 nm than Saturn Yellow.'
