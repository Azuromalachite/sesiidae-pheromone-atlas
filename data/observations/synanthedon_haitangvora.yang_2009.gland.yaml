evidence:
  reference: spa.ref.yang_2009
  taxon_name_as_reported: Synanthedon haitangvora
  source_location: Results; Fig. 1; Table 1
  author_statement: Two major components from pheromone gland extracts of Synanthedon haitangvora females were identified as (Z,Z)-3,13-octadecadienyl acetate ... and (E,Z)-2,13-octadecadienyl acetate
  unresolved:
  - dispersion of the ratio and the titre
  - whether the extracted females were calling
  notes: Late-instar larvae dug from apple trunks at Suwon (37.2 N, 127.1 E), May-June 2008, reared on artificial diet at 23 C, 16L:8D; sexes separated at eclosion (virgin is the Atlas reading). Females
    call during the photophase; glands of 1- to 2-day-old females were taken 4 h into photophase, extruded and excised, each extracted 10 min in 10 ul hexane with 10 ng 13:OAc. Identity from MS library
    match, then retention indices and spectra against authentic standards on DB-Wax and DB-23 (Table 1 lists all four 3,13 and 2,13 isomers of the acetates and alcohols). DMDS derivatisation did not locate
    the double bonds. Ratio of peaks 1-9 0.2:1.5:0.4:3:2:87:100:1:1.5; E2,Z13-18:OAc 'estimated as 21.5 ng per female' (N = 15). Also C21, C23, C25 and C27 alkanes.
