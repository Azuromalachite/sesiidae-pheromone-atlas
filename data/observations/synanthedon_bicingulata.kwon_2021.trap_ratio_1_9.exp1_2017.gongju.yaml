  author_statement: "Among test ratios of 1:9, 4:6, 6:4, and 9:1, a 4:6 mixture was the most attractive, followed by 1:9 and 6:4."
  notes: "Experiment 1, Gongju, 28 April - 13 June 2017 (spring, Atlas label from the dates), green bucket traps, 4 blocks, one-way ANOVA and Tukey HSD (F4,15 = 38.567, P < 0.001). The authors give the optimum as about 4.3:5.7: that is this 4:6 lure corrected for purity, and no 4.3:5.7 lure was tested. Lures synthesised by the authors: 1 mg per sleeve-stopper septum with 1 mg BHT, changed monthly; traps 3 m up on roadside cherry trees, at least 15 m apart, re-randomised every two weeks. Purity is GC-MS peak area; the authors do not say what the impurities are and state that the lures held no isomeric compounds. Atlas reading of Fig. 4: the impurities are minor peaks 0.07-0.37 min after each main peak (13.763 and 13.903 min for E3; 13.745, 13.903 and 14.037 min for Z3), on a column where E3 and Z3 eluted 0.035 min apart in separate runs, so geometric isomers among them are not excluded. Means read from bar charts. Letters b vs a. At the same site in autumn 2018, in yellow traps, the same ratio caught nothing (trap_ratio_1_9.exp1_2018.gongju): season and trap colour changed together."
