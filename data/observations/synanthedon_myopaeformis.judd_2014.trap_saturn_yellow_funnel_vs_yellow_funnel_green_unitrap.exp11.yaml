evidence:
  reference: spa.ref.judd_2014
  source_location: Experiment 11; Table 1
  notes: 'Experiment 11, 12-24 July 2007, 5 linear blocks (Table 1 n), 3 unitraps 1 m apart east-west in one tree row, blocks at least 50 m apart, checked every 4 days and rotated clockwise one position, so each trap occupied each position at least once. Component varied in the experiment: funnel. This treatment and comparator differ in the funnel colour only, which the trap schema cannot express; it is in trap.colour. Two-way randomised block ANOVA F2,8 = 20.55, P < 0.001, Tukey (alpha 0.05). Means +- SE from Table 1: 12.6 +- 2.1 (G:S:G:W, letter b) vs 27.6 +- 4.8 (G:Y:G:W, letter a). Unitraps (lid, funnel, bucket, lure basket); all-green and all-white from Contech Enterprises (embossed as the original Unitrap, made in the UK), all-yellow and all-red from AgBio Inc. (made by ChemTica International, Costa Rica); translucent white lure basket (AgBio) holding the septum unless stated; 2.5 x 5.0 cm 10% dichlorvos strip (Vaportape II) in every bucket. Lure: grey halobutyl rubber septum (West Co.) loaded with 1 mg Z3,Z13-18:OAc (Pherobank, >95% isomeric purity) in 200 µL hexane; the micro sign was checked in the PDF font stream: ''1 mg'' is set in the text font, ''200 µL'' uses the symbol font. The authors give average 500-550 nm reflectance of the funnels as 18% (green), 37% (standard yellow) and 175% (Saturn Yellow); Fig. 3A shows the Saturn Yellow pigment on a white unitrap, and it reflects more ultraviolet than the standard yellow funnel. Contrast singled out in the text (sixfold vs threefold increase over the all-green trap).'
