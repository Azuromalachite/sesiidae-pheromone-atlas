  notes: 'Experiment 14, 5-12 August 2010, 5 blocks, the two all-yellow unitraps paired 5 m apart, blocks 50 m apart; two-sample t-test t = 0.328, df = 8, P = 0.751. Means +- (presumably SE; the text does not say) 24.0 +- 15.9 (banded) vs 22.6 +- 6.4 (plain black). Only the lure basket differs; recorded in trap.colour because the trap schema has no basket field. The band was meant to mimic the female''s orange-red abdominal band. Unitraps (lid, funnel, bucket, lure basket); all-green and all-white from Contech Enterprises (embossed as the original Unitrap, made in the UK), all-yellow and all-red from AgBio Inc. (made by ChemTica International, Costa Rica); translucent white lure basket (AgBio) holding the septum unless stated; 2.5 x 5.0 cm 10% dichlorvos strip (Vaportape II) in every bucket. Lure: grey halobutyl rubber septum (West Co.) loaded with 1 mg Z3,Z13-18:OAc (Pherobank, >95% isomeric purity) in 200 µL hexane; the micro sign was checked in the PDF font stream: ''1 mg'' is set in the text font, ''200 µL'' uses the symbol font.'
