  taxon_name_as_reported: Macroscelesia longipes
  source_location: Results; Fig. 2
  author_statement: Three GC-MS injections (1 FE each) of M. longipes extract gave a mean titer of E2,Z13-18:OH of 16.8±8.0 ng/female. E2,Z13-18:Ald was detected in one sample (0.4 ng/female), but not in
    the other two.
  unresolved:
  - detection limit for the aldehyde in the two negative samples and for E2,Z13-18:OAc
  - whether the extracted females were calling
  notes: About 20 galls with larvae from a riverbed near Lake Sanaru, August 2003; adults after 15-20 days at 25 C, 15L:9D. Females called 1-4 h after lights on; abdominal tips excised 4 h after lights
    on, extracted as for M. japona (virgin is the Atlas reading of that procedure). GC-MS 'confirmed' both compounds by comparison with M. japona's components and the synthetics; the aldehyde was not reduced
    here. The aldehyde was found in one of three females only. E2,Z13-18:OAc not detected (Fig. 2b).
