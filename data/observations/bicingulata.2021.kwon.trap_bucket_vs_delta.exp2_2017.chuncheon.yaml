evidence:
  reference: spa.ref.kwon_2021
  source_location: "Experiment 2; Fig. 6; abstract"
  author_statement: "A significant difference was seen in the number of S. bicingulata males caught in bucket and delta traps (t = 4.174, p < 0.01, df = 8)."
  notes: "Experiment 2, Chuncheon, 9 August - 25 September 2017, 5 blocks, t test. Means +- SE from the abstract: 13.2 +- 2.2 (bucket) and 7.6 +- 2.0 (delta). The two traps also differ in colour (green vs white), so design and colour are confounded. Lures synthesised by the authors: 1 mg per sleeve-stopper septum with 1 mg BHT, changed monthly; traps 3 m up on roadside cherry trees, at least 15 m apart, re-randomised every two weeks. Purity is chemical purity from the GC-MS trace; the authors state the lures held no isomeric compounds, but that rests on a non-polar HP-5MS column, and whether it separates the 3,13 geometric isomers is not shown (Atlas inference). Means read from bar charts."
