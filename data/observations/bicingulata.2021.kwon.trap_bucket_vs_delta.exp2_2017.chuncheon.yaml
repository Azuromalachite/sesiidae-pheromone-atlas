comparator:
  description: same lure in a white delta trap
  blend: [{compound: spa.cmpd.e3_z13_18_oac, amount: {value: 0.4, unit: milligram}, purity: {value: 94.18, kind: chemical, basis: measured, method: GC-MS TIC on HP-5MS}}, {compound: spa.cmpd.z3_z13_18_oac, amount: {value: 0.6, unit: milligram}, purity: {value: 82.8, kind: chemical, basis: measured, method: GC-MS TIC on HP-5MS}}]
