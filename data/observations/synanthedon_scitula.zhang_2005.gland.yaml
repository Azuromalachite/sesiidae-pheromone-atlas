  notes: Larvae dug from apple burrknots in Jefferson and Berkeley Counties (WV) and Frederick County (VA), October-November 2002 and 2003, reared on diet at 25 C, 16L:8D; adults emerged at Beltsville.
    Glands of 2- to 13-day-old virgin females (previously aerated), everted ovipositors soaked at least 2 h in methylene chloride-methanol 3:1 and re-extracted; combined extract of 20 females on GC-MS (DB-WAXETR).
    Z,Z-3,13-ODDA confirmed by GC-EAD retention on DB-WAXETR and DB-5 and co-injection; E,Z-2,13-ODDA by co-injection on GC-MS. 'Deleted' in the source is read as 'detected'. Z,E-3,13-ODDA, seen in effluvia,
    was not detected in gland extracts by SIM.
