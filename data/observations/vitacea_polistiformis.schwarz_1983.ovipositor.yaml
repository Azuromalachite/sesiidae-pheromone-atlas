  notes: 'Field-collected female pupae; adults emerged in the laboratory and ovipositors were extracted with heptane (method of Klun et al. 1980); seven females in all. One major peak: GC-MS M+ 308 and
    M-60 at 248 (octadecadienyl acetate); microozonolysis gave undecanedial (nine carbons between the double bonds) and no identifiable short aldehyde. Candidates Z,Z-3,14, Z,Z-4,15, Z,Z-5,16 (all four
    isomers), Z-6,17 and Z,Z-2,13 were excluded by retention; synthetic E,Z-2,13-18:OAc matched on SP2340, SP1000 and DB-1 with no difference in mass spectrum, and only one of the four isomers from thiol
    equilibration of Z,Z-2,13 co-eluted with it. A minor component eluting after it on non-polar columns had the spectrum of an octadecenyl acetate (position not determined).'
