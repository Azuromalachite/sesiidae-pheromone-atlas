evidence:
  reference: spa.ref.yang_2011
  taxon_name_as_reported: Synanthedon bicingulata
  source_location: "Results, Chemical Analysis; Fig. 1; Table 1"
  author_statement: "we were able to tentatively identify compounds 4, 5, and 6 as E2,Z13-18:OAc, E3,Z13-18:OH, and Z3,Z13-18:OH, respectively, by comparison of their RIs"
  unresolved: [whether N = 10 means ten single-female extracts or ten injections of pooled extract; dispersion of the ratio; absolute amounts per female]
  notes: "Pupae from peach trunks at Jeonju (35.4 N, 127.0 E), May 2009, reared at 25 C, 14L:10D. Glands of 1-2-day-old calling virgin females excised 7 h into photophase (the authors chose that time because virgins call in the photophase; that the extracted females were calling is not stated), 10 ul hexane for 10 min. Ratio 2:58:100:6:3:4 (N = 10) for compounds 1-6. E3:Z3 acetate 58:100 is about 37:63, which the authors round to 4:6. DMDS adducts located the 3,13 positions in the acetates (18 female equivalents) but did not resolve geometry; geometry rests on retention indices on two columns. The authors presume the two alcohols are precursors of the two acetates: an author hypothesis, not a measured conversion."
