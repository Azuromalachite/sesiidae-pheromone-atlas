  notes: 'Ovipositors of 800 1- to 3-day-old unmated females ground three times with pentane; silicic-acid LC (pentane-ether 95:5 fraction active), then sequential packed-column GC on SE-30, OV-101 and
    Carbowax 20M, guided by a field bioassay. The active compound was over 99.5 percent pure on SP-2300, Dexsil and DEGS. Structure from CI-MS, IR (trans band at 970/cm in S. pictipes; the text says the
    ''960'' band was absent in S. exitiosa), hydrogenation to octadecyl acetate, microozonolysis (valeraldehyde and 1,10-decanedial; the middle product decomposed, and its spectrum, consistent with 3-oxopropyl
    acetate, came only from the synthetic) and comparison with all four synthetic 3,13 isomers, of which DEGS completely resolved only the (E,E)-isomer. No abundance class: nothing else in the extract was
    characterised.'
