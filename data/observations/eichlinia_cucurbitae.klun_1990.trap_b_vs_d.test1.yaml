  notes: 'Test 1, June 12-25 1986, 4 replicates. Treatment B (compounds 1,3-10,12,13) vs D (compounds 1,4-10), numbers as in Table 1. Table 3: mean male capture per day, Duncan''s multiple range test (alpha
