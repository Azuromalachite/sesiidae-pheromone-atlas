  source_location: Fig. 5C
  notes: 'Every lure, the baseline included, carried up to 0.3 percent E,Z-3,13-ODDA as an impurity of the Z,Z-3,13-ODDA (up to about 0.26 parts in 88), so the doses here are additions on top of that (Atlas
    reading). Fig. 5, June 24 - July 23 2004, 1,086 males, N = 30, F = 181.4; letters ternary, +0.5, +1, +2, +3: a, b, b, b, b. Commercial apple orchards; traps about 1.2 m up, randomized within three to
    five rows separated by buffer rows, at least about 20 m apart, rotated weekly; 1 mg per septum, compounds as the parts printed under each bar. Z,Z-3,13-ODDA (Bedoukian, about 90 percent) purified on
    silver-nitrate silica to under 0.3 percent E,Z-3,13-ODDA; the other isomers (PheroBank) checked above 97 percent on DB-WAXETR. Means read from the bar chart.'
  author_statement: the addition of as little as 0.5% of the geometric isomer, E,Z-3,13-ODDA, to the most attractive ternary blend ... strongly antagonized the attraction of male DWB to traps
