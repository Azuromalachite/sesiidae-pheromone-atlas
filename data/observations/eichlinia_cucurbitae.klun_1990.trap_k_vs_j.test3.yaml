  notes: 'Test 3, June 22 - July 13 1987, 3 replicates. Treatment K (compounds 1,12) vs J (compounds 1), numbers as in Table 1. Table 3: mean male capture per day, Duncan''s multiple range test (alpha 0.05).
    Each lure held 685 ug E,Z-2,13-18:OAc plus the other compounds in their Table 1 proportions, so the amounts here are Table 1 percentages as ratio parts (685 ug per 68.5 parts, i.e. 10 ug per part),
    and dose is that arithmetic (Atlas reading). Conical traps of Webster et al. 1986, 30 m apart, 1 m up, at the Beltsville Agricultural Research Center and in community-garden squash plantings; usually
    checked daily. Unsaturated compounds made geometrically pure by argentation HPLC (no figure). No virgin-female comparison was possible.'
