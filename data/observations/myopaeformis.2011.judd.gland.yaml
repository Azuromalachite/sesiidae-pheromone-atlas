  notes: Larvae from infested apple trees near Cawston, spring 2006, reared on pinto-bean diet at 23 C, 16L:8D; abdominal tips of 1-2-day-old females, 20 ul hexane per gland for 15 min; one female equivalent per GC-EAD run, and a concentrated extract for GC-MS. Only Z3,Z13-18:OAc had a mass spectrum. Z3,Z13-18:OH and E2,Z13-18:OAc were below the MS threshold; the authors identify them ('identified as', Fig. 1) by retention time. The text says the match held on four columns, but Table 1 marks antennal responses for Z3,Z13-18:OH on DB-5, DB-17 and DB-23 only and for E2,Z13-18:OAc on DB-17 and DB-23 only. E3,Z13-18:OAc showed only on DB-23, with inconsistent antennal responses; the authors name it without calling it identified, so no identification is recorded. No amounts or ratios are given.
