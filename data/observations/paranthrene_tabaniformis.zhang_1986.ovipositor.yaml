  notes: 'Ovipositor areas of 1- to 2-day-old unmated females (50 FE), clipped and extracted with CH2Cl2; insects reared on artificial diet (origin not stated). GC-MS on SE-54: spectrum and retention identical
    to synthetic E3,Z13-18:OH. Mass fragmentography (m/z 266, 248) on FFAP separated the four synthetic isomers (ZZ 18.12, ZE 17.40, EZ 17.05, EE 16.42 min); the natural peak matched EZ, and co-injection
    enhanced only that peak. The text states no absence. The negatives here are read from Fig. 2B (Atlas reading): the extract''s m/z 266 (M+) trace is flat at the retention times of the EE, ZE and ZZ standards
    in Fig. 2A, with only the EZ peak. The m/z 248 trace cannot exclude ZE or ZZ, because an unassigned, off-scale m/z 248 peak covers that window; Karalius et al. 2001 suggest minor compounds may have
    been below detection. Beijing area is where the field tests ran; where the insects came from is not said.'
