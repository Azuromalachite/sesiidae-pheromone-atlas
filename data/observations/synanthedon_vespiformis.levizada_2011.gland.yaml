  source_location: Results, Chemical analysis; Fig. 2; Table 1
  author_statement: No traces of other octadecadienyl acetates or of the corresponding alcohols were found.
  unresolved: [whether the +- values are SD or SE, detection limits for the negatives, mating status of the extracted females]
  notes: 'Larvae from root collars of peach and nectarine, Kefar Tabor, March-June 2010, reared on a peach-cortex diet at 24 C in darkness. One-day-old calling females; samples of 1-3 glands in 20 ul hexane for 15 min. Ratio 83:17 from 15 samples; amounts 14.0 +- 6.2 and 2.9 +- 1.3 ng per gland from 25 females (dispersion type not stated). The authors call the ratio about 4:1 and used 4:1 in the field. The geometry rests on retention on DB-23: RTX-5 does not separate the 3,13 isomers (Table 1) and the mass spectra do not distinguish them (Atlas note). Negatives: no other octadecadienyl acetates (standards of all four 3,13 isomers and all four 2,13 acetates were run; the Z2,E13 and E2,E13 acetates have no Atlas compound record) and no corresponding alcohols, for which no standards are listed; no detection limit is given.'
