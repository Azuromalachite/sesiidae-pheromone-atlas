  source_location: Experiment 12; Table 1
  notes: 'Experiment 12, 12-24 July 2007, 9 linear blocks (Table 1 n), 3 unitraps 1 m apart east-west in one tree row, blocks at least 50 m apart, checked every 4 days and rotated clockwise one position, so each trap occupied each position at least once. Component varied in the experiment: lid and bucket. This treatment and comparator differ in the bucket colour only, which the trap schema cannot express; it is in trap.colour. Two-way randomised block ANOVA F2,16 = 4.57, P = 0.027, Tukey (alpha 0.05). Means +- SE from Table 1: 20.5 +- 3.4 (G:Y:W:W, letter b) vs 18.2 +- 5.1 (G:Y:G:W, letter b). Unitraps (lid, funnel, bucket, lure basket); all-green and all-white from Contech Enterprises (embossed as the original Unitrap, made in the UK), all-yellow and all-red from AgBio Inc. (made by ChemTica International, Costa Rica); translucent white lure basket (AgBio) holding the septum unless stated; 2.5 x 5.0 cm 10% dichlorvos strip (Vaportape II) in every bucket. Lure: grey halobutyl rubber septum (West Co.) loaded with 1 mg Z3,Z13-18:OAc (Pherobank, >95% isomeric purity) in 200 µL hexane; the micro sign was checked in the PDF font stream: ''1 mg'' is set in the text font, ''200 µL'' uses the symbol font. G:Y:W:W is the industry standard multicolour unitrap (green lid, yellow funnel, white bucket) that two earlier sesiid studies found more attractive than all-yellow traps. Contrast singled out in the text (industry standard no more attractive than green lid, yellow funnel, green bucket).'
