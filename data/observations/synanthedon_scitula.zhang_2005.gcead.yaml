  - number of antennae for the extracts
  - whether the 0.03-0.05 mV readings to the other three 2,13 isomers count as responses (not recorded)
  notes: 'Fig. 1: two EAD responses in a gland extract of two females, three in effluvia of seven; the third (Z,E-3,13-ODDA) ''sometimes elicited EAD responses''. Table 1, synthetic 10 ng, N = 3, mean +-
    SD mV: E,E-3,13 0.13 +- 0.03 ab, Z,E-3,13 0.24 +- 0.04 a, E,Z-3,13 0.30 +- 0.09 a, Z,Z-3,13 0.30 +- 0.10 a, E,Z-2,13 0.20 +- 0.13 ab; Z,E-, Z,Z- and E,E-2,13 0.03-0.05 b. Fig. 1C: synthetic Z,Z-3,13
    and E,Z-2,13 ''also elicited strong antennal responses''. ''Active'' for the synthetics follows the text (all four 3,13 isomers ''significant''; E,Z-2,13 ''strong'' in Fig. 1C); by the Table 1 letters
    alone, the ''ab'' responses (E,E-3,13, E,Z-2,13) are not separable from the ''b'' group.'
