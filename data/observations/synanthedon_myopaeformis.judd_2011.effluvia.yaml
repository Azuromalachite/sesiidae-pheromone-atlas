  author_statement: only (3Z,13Z)-18:OH (A) and (3Z,13Z)-18:OAc (B) were detected using GC-EAD analysis of the effluvia from calling females (Fig. 2).
  unresolved: ['detection limit for E2,Z13-18:OAc in effluvia']
  notes: 'Pupae collected in 2010; 2-13 virgin 1-2-day-old females in a glass chamber at any time over 7 days, 1056 female-hour equivalents in all; 40 FHE per GC-EAD run on DB-5. Detection here means an antennal response at the standard''s retention time; the authors say this ''analytically confirms'' Z3,Z13-18:OAc, whose peak co-eluted with a non-pheromonal compound. The E2,Z13-18:OAc negative is weak (Atlas reading of Table 1): on DB-5 it elutes 0.06 min after Z3,Z13-18:OAc, and even in gland extracts it drew no antennal response on DB-5, only on DB-17 and DB-23. No detection limit is given.'
