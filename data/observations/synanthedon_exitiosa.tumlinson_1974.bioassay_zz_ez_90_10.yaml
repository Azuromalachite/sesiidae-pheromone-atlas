  notes: 'Fig. 2: average number of males responding, five replicates, read from the bar chart; bars below 1 are about the drawn baseline thickness and may be zero. The figure does not label which axis
    row is the (E,Z)-isomer; the Atlas reads the top row as (E,Z) because S. pictipes peaks at 100. Total 120 ng per test is the Atlas reading of the legend, which gives an equivalence (about 30 FE of S.
    pictipes, about 1 FE of S. exitiosa), not a stated load; the text''s units differ, see the reference notes. Assay of note 8, as the Atlas reads it: material in pentane in a glass petri dish on the ground,
    males responding counted over 35 min; the paper names Byron, Georgia only for the earlier bioassays, so locality is left null. The text says the mixtures were compared with the 99.5+ percent pure isomers,
    not that they were made from them; no purity is recorded. No test statistic or per-ratio comparison is printed.'
