  notes: "Experiment 4, Yanggu, 19 August - 6 October 2019, 4 blocks, F5,18 = 5.470, P = 0.0031, Tukey HSD. Six colours tested (black, blue, green, red, yellow, white); L*a*b* from Table 1. Across sites capture rose with b* (R2 = 0.389, P < 0.001), weakly with L* (R2 = 0.085) and not with a*. Lures synthesised by the authors: 1 mg per sleeve-stopper septum with 1 mg BHT, changed monthly; traps 3 m up on roadside cherry trees, at least 15 m apart, re-randomised every two weeks. Purity is GC-MS peak area; the authors do not say what the impurities are and state that the lures held no isomeric compounds. Atlas reading of Fig. 4: the impurities are minor peaks 0.07-0.37 min after each main peak (13.763 and 13.903 min for E3; 13.745, 13.903 and 14.037 min for Z3), on a column where E3 and Z3 eluted 0.035 min apart in separate runs, so geometric isomers among them are not excluded. Means read from bar charts. Letters a vs b."
