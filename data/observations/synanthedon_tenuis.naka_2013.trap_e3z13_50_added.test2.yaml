evidence: {reference: spa.ref.naka_2013, source_location: 'Table 2, test II', notes: 'Test II, Gifu City, 7 May - 28 October 2003, N = 6. Mean +- SE per trap: 8.3 +- 2.9 (a) vs 10.7 +- 4.0 (a). Atlas note: the paper recalls that Tamaki et al. 1977 found 5 percent E3,Z13-18:OAc decreased attraction (spa.obs.synanthedon_tenuis.tamaki_1977.trap_e3oac_added); here 5 percent (50 ug) had no significant effect. Traps 1.5 m up, rotated after each count, checked about weekly; log(x + 0.5) transformed, one-way ANOVA with Tukey-Kramer HSD or t test; control treatments that caught nothing were left out of the analyses. Shin-Etsu acetates and the authors'' synthetic isomers stated above 98 percent pure; alcohols made by saponifying the acetates, purity not stated.'}
