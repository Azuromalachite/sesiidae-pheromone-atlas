  taxon_name_as_reported: Synanthedon bicingulata
  source_location: "Experiment 2; Fig. 6; abstract"
  author_statement: "A significant difference was seen in the number of S. bicingulata males caught in bucket and delta traps (t = 4.174, p < 0.01, df = 8)."
  notes: "Experiment 2, Chuncheon, 9 August - 25 September 2017, 5 blocks, t test. Means +- SE from the abstract: 13.2 +- 2.2 (bucket) and 7.6 +- 2.0 (delta). The two traps also differ in colour (green vs white), so design and colour are confounded. Lures synthesised by the authors: 1 mg per sleeve-stopper septum with 1 mg BHT, changed monthly; traps 3 m up on roadside cherry trees, at least 15 m apart, re-randomised every two weeks. Purity is GC-MS peak area; the authors do not say what the impurities are and state that the lures held no isomeric compounds. Atlas reading of Fig. 4: the impurities are minor peaks 0.07-0.37 min after each main peak (13.763 and 13.903 min for E3; 13.745, 13.903 and 14.037 min for Z3), on a column where E3 and Z3 eluted 0.035 min apart in separate runs, so geometric isomers among them are not excluded."
