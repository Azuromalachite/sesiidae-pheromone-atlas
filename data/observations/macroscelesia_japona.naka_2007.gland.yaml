  source_location: Results; Fig. 1
  author_statement: Two GC-EAD-active components were found in a crude extract of M. japona female pheromone gland, and identified as (2E,13Z)-2,13-octadecadien-1-ol (E2,Z13-18:OH) and (2E,13Z)-2,13-octadecadienal
  unresolved:
  - detection limit for E2,Z13-18:OAc
  notes: 'About 40 overwintering larvae from Maihara City, November 2003, vernalised 2 months at 8 C, then 25 C, 15L:9D. Abdominal tips of 1- or 2-day-old virgin females excised when calling, each in 250
    ul hexane for 5 min. Ten GC-MS injections (1 FE each) of different extracts: E2,Z13-18:OH 0.3 +- 1.2 and E2,Z13-18:Ald 4.2 +- 5.4 ng per female (mean +- SD), ''roughly 1:10'' with ''considerable variation''.
    Alcohol: Florisil 10 percent ether fraction, mass spectrum like synthetic E2,Z13-18:OH (M+ vs M-18 intensities separate 2,13 from 3,13 dienols), retention equal to it and unlike the other three 2,13
    isomers on DB-23. Aldehyde: 5 percent ether fraction, spectrum like synthetic E2,Z13-18:Ald, and NaBH4 reduction of the fraction gave E2,Z13-18:OH. The authors note identification was by comparison
    with known compounds, not direct chemistry. E2,Z13-18:OAc not detected (Fig. 1b mass chromatograms).'
