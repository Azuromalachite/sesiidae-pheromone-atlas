  author_statement: "Yellow bucket traps caught the largest number of male"
  notes: "Experiment 4, Yanggu, 19 August - 6 October 2019, 4 blocks, F5,18 = 5.470, P = 0.0031, Tukey HSD. Six colours tested (black, blue, green, red, yellow, white); L*a*b* from Table 1. Across sites capture rose with b* (R2 = 0.389, P < 0.001), weakly with L* (R2 = 0.085) and not with a*. Lures synthesised by the authors: 1 mg per sleeve-stopper septum with 1 mg BHT, changed monthly; traps 3 m up on roadside cherry trees, at least 15 m apart, re-randomised every two weeks. Purity is chemical purity from the GC-MS trace; the authors state the lures held no isomeric compounds, but that rests on a non-polar HP-5MS column, and whether it separates the 3,13 geometric isomers is not shown (Atlas inference). Means read from bar charts. Letters a vs b."
