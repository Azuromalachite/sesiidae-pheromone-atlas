  source_location: Experiment 8; Table 1
  author_statement: With the exception of the lid (experiment 8), introducing a white component to yellow unitraps did not significantly influence catch (Table 1).
  notes: 'Experiment 8, 30 June - 12 July 2011, 6 linear blocks (Table 1 n), 3 unitraps 1 m apart east-west in one tree row, blocks at least 50 m apart, checked every 4 days and rotated clockwise one position, so each trap occupied each position at least once. Component varied in the experiment: lid. This treatment and comparator differ in the lid colour only, which the trap schema cannot express; it is in trap.colour. Two-way randomised block ANOVA F2,10 = 4.44, P = 0.042, Tukey (alpha 0.05). Data square-root transformed (x + 0.5) before ANOVA. Means +- SE from Table 1: 101.5 +- 18.9 (W:Y:Y:W, letter b) vs 177.0 +- 52.1 (Y:Y:Y:W, letter a). Unitraps (lid, funnel, bucket, lure basket); all-green and all-white from Contech Enterprises (embossed as the original Unitrap, made in the UK), all-yellow and all-red from AgBio Inc. (made by ChemTica International, Costa Rica); translucent white lure basket (AgBio) holding the septum unless stated; 2.5 x 5.0 cm 10% dichlorvos strip (Vaportape II) in every bucket. Lure: grey halobutyl rubber septum (West Co.) loaded with 1 mg Z3,Z13-18:OAc (Pherobank, >95% isomeric purity) in 200 µL hexane; the micro sign was checked in the PDF font stream: ''1 mg'' is set in the text font, ''200 µL'' uses the symbol font.'
