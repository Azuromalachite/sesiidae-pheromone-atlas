  author_statement: "In these pheromone extracts, no acetate components were detected."
  unresolved: [whether the reported spread (10.8 and 1.3 ng) is SD or SE; detection limit for the acetates; which acetates were looked for]
  notes: "About 40 overwintering larvae collected at Toyota City, Aichi, December 2003, vernalised for a month, reared at 23 C, 13L:11D. Calling induced by direct sunlight; abdominal tips of 1-2-day-old virgin females extracted singly in 250 ul hexane for 5 min. Titres from eight 1-female-equivalent GC-MS injections: 12.3 +- 10.8 and 1.4 +- 1.3 ng per female, a ratio of about 9:1 despite large individual variation. The acetates are recorded as negatives because the authors had synthetic 3,13 acetates as references and state none were detected; the detection limit is not given. The authors call it the first sesiid known to secrete these two alcohols as pheromone components without any acetate."
