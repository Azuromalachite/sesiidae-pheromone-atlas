taxon_id: spa.tax.eichlinia_cucurbitae
accepted_name: Eichlinia cucurbitae
authority: (Harris, 1828)
taxonomy:
  family: Sesiidae
  genus: Eichlinia
  species: cucurbitae
synonyms:
- name: Melittia cucurbitae
  authority: (Harris, 1828)
  source: NCBI taxid 655047 uses this combination; GBIF accepts Eichlinia cucurbitae (12087490) and has no entry for it, checked 2026-10-23
  notes: The combination Klun et al. 1990 used, and the usual name in the pheromone literature.
- name: Melittia satyriniformis
  authority: Hubner, 1827-1831
