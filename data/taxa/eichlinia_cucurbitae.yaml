  notes: The name Zhang et al. 2005 used when citing the squash vine borer.
taxon_concept: The squash vine borer of Klun et al. 1990 (Beltsville, Maryland). The Atlas follows the GBIF backbone for the accepted combination; NCBI keeps Melittia.
identifiers:
