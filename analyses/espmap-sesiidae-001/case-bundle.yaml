# espmap-sesiidae-001: the case bundle. Approved by the user 2026-10-23;
# revised before the freeze on the Atlas's review (a direct selection rule
# for motivating observations, and a test for each evidence label), and
# re-approved by the user the same day. Frozen with the analysis plan once
# the Atlas's computed/ gate is pushed.
#
# Which molecules belong to each contrast, and what each one is: something
# nature was observed to make or respond to, or something constructed for a
# controlled comparison. Frozen (by commit SHA) before any ensemble of this
# study is computed, and before anything is visualised. Its home is the
# Sesiidae Pheromone Atlas (analyses/espmap-sesiidae-001/); Arrowfield links
# to it.
case: espmap-sesiidae-001
status: frozen
atlas_pin: e8ca21261d40d05ecad2e1cb9981e1d2f2b440da

# evidence_status is a label of THIS STUDY, not a property of an Atlas
# compound: the Atlas gives compounds no role; roles come only from its
# observations. Each label has a test, applied at atlas_pin:
#   atlas_observed          the Atlas compound has at least one observation
#                           in which it takes a role (treatment, comparator,
#                           detected, not_detected or an antennal response).
#                           This says the Atlas holds evidence about it, not
#                           what that evidence shows: E3,Z13-18:OAc, for
#                           example, is not_detected in the S. tenuis gland
#                           and antagonistic in its lures.
#   teaching_control        not an Atlas compound; constructed so that a
#                           comparison changes one thing; never presented as
#                           observed
#   computational_counterfactual
#                           a structure that does not occur, computed to ask
#                           "what if"; none in this case
molecules:
  - id: spa.cmpd.z3_z13_18_oh
    name: (3Z,13Z)-octadeca-3,13-dien-1-ol
    evidence_status: atlas_observed
  - id: arrowfield.control.z3_z13_18_al
    name: (3Z,13Z)-octadeca-3,13-dienal
    evidence_status: teaching_control
    why: holds the Z3,Z13 backbone fixed while only the head group changes.
      Not in the Atlas. The aldehyde the Atlas records is
      spa.cmpd.e2_z13_18_al, which is not in this case.
  - id: spa.cmpd.z3_z13_18_oac
    name: (3Z,13Z)-octadeca-3,13-dien-1-yl acetate
    evidence_status: atlas_observed
  - id: spa.cmpd.e3_z13_18_oac
    name: (3E,13Z)-octadeca-3,13-dien-1-yl acetate
    evidence_status: atlas_observed
  - id: spa.cmpd.e2_z13_18_oac
    name: (2E,13Z)-octadeca-2,13-dien-1-yl acetate
    evidence_status: atlas_observed

contrasts:
  - id: A_headgroup
    question: how the head group changes the electrostatics of the same
      backbone (descriptive chemistry, not a biological contrast)
    members: [spa.cmpd.z3_z13_18_oh, arrowfield.control.z3_z13_18_al,
              spa.cmpd.z3_z13_18_oac]
    biological_contrast: only spa.cmpd.z3_z13_18_oh vs spa.cmpd.z3_z13_18_oac;
      the aldehyde enters as a teaching control and carries no biological
      claim
  - id: B_stereo
    question: does E vs Z at C3 change the local electrostatics beyond what
      the molecule's own shape changes do?
    members: [spa.cmpd.z3_z13_18_oac, spa.cmpd.e3_z13_18_oac]
  - id: C_position
    question: does moving the C=C from C3 to C2 change the local
      electrostatics beyond what shape changes do?
    members: [spa.cmpd.e3_z13_18_oac, spa.cmpd.e2_z13_18_oac]

# The observations that motivate B and C are selected from the Atlas at
# atlas_pin by a stated rule, not chosen by hand. An observation motivates a
# contrast if it directly compares the contrast's two members:
#   (a) an electrophysiology record whose responses include both members; or
#   (b) a field-trapping record whose treatment and comparator blends differ
#       ONLY in the two members (presence or amount), with the same trap and
#       dispenser, and with both members present in the pair of blends.
# Every effect and significance is kept as recorded, no_effect, not_tested
# and not_reported included. (An earlier wording, "every trapping or EAG
# record in a taxon where both members were tested", took 358 and 269
# records, most of which never contrast the pair. It was replaced before the
# freeze on the Atlas's review.)
# The list is generated by motivating.py, committed beside this file, and is
# reproducible at atlas_pin: B_stereo 90 observations in 11 taxa, C_position
# 42 observations in 9 taxa (Atlas e8ca212).
motivating_observations:
